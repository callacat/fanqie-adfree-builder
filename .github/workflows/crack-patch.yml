name: fanqie-crack-patch

# round16b：破解版底包 patch 构建（卡密体系去除，按 docs/round16b-依赖分析.md 执行清单 P1-P3）
# 原则：宁可残骸不可崩溃——只断 Java invoke，不删类/方法/so
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK（build-tools 35）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;35.0.0" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: 下载工具（apktool + baksmali）
        run: |
          curl -sSL -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -sSL -o /usr/local/bin/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar
          java -jar /usr/local/bin/apktool.jar --version

      - name: 拉 mod 样本 + sha256 校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download samples -R "$GITHUB_REPOSITORY" -p 'fanqie-73368-mod-218M.apk' -D .
          echo "fdf7e7c1b56a0f3409bf4bf3d1a9c7c252f43d951de0debdbccbb8ff798a3024  fanqie-73368-mod-218M.apk" | sha256sum -c -

      - name: apktool d 解 mod 包
        run: |
          cd work
          java -jar /usr/local/bin/apktool.jar d -f -o mod_src fanqie-73368-mod-218M.apk
          echo "smali 树: $(find mod_src -name '*.smali' | wc -l) 文件"

      - name: patch（r16b P1-P3 + r17 P4/P5 掐入口 + P6 弹窗拦截静态补位）
        run: |
          cd work
          python3 ../scripts/patch_16b.py "$PWD/mod_src" | tee patch-16b.log
          grep -q 'PATCH_16B_DONE' patch-16b.log || { echo '!! patch 脚本未正常结束'; exit 1; }
          grep -q 'P2-rN 合计' patch-16b.log && ! grep -q 'P3-registerNatives: WARN(0 命中' patch-16b.log || { echo '!! P2/P3 关键点位未命中'; exit 1; }
          echo "== round17 计数断言 =="
          S=$(grep 'PATCH17_SUMMARY' patch-16b.log)
          echo "$S"
          P4=$(echo "$S" | grep -oP 'P4=\K[0-9]+'); P5=$(echo "$S" | grep -oP 'P5=\K[0-9]+')
          P7=$(echo "$S" | grep -oP 'P7=\K[0-9]+')
          P6C=$(echo "$S" | grep -oP 'P6const=\K[0-9]+'); P6A=$(echo "$S" | grep -oP 'P6a=\K[0-9]+')
          P6Z=$(echo "$S" | grep -oP 'P6z56=\K[0-9]+')
          [ "$P4" = "1" ] || { echo "!! P4 计数=$P4 预期1"; exit 1; }
          [ "$P5" = "4" ] || { echo "!! P5 计数=$P5 预期4"; exit 1; }
          [ "$P7" = "2" ] || { echo "!! P7 计数=$P7 预期2（round17b，枚举明细见 log 不确定点）"; exit 1; }
          # P6 硬门：文案 const 引用者、assertIllegalAccess 真身、全屏链至少掐到一处（073368 混淆漂移时全部落空=定位失败，交人工）
          [ $((P6C + P6A + P6Z)) -ge 1 ] || { echo "!! P6 无任何落位（const=$P6C 真身=$P6A z56=$P6Z）——73368 定位失败"; exit 1; }
          grep -E 'P6-recon|P6-const|P6a|P6b|P6net|P6z56|不确定点' patch-16b.log
          # mod 资源脏条目清理：作者重打包遗留 public.xml invalid* 类型（aapt1 容忍 aapt2 拒绝，五跑实锤 54479 行）
          sed -i 's|<public type="invalid[0-9]*" |<public type="ignore_me" |g' mod_src/res/values/public.xml
          sed -i '/type="ignore_me"/d' mod_src/res/values/public.xml
          # 非法资源目录本体（六跑实锤 res/invalid15/arm_path.xml）
          rm -rf mod_src/res/invalid*
          echo "public.xml invalid 残留: $(grep -c 'invalid' mod_src/res/values/public.xml || echo 0)；res/invalid 目录残留: $(ls -d mod_src/res/invalid* 2>/dev/null | wc -l)"

      - name: patch 自检（改动点复核 + 残留引用扫描）
        run: |
          cd work
          echo "== P1 落位核验 =="
          grep -rn 'PATCHED_ROUND16B P1' mod_src/smali*/ | head -3
          echo "== P2/P3 落位统计 =="
          grep -rc 'PATCHED_ROUND16B P2' mod_src/smali*/ 2>/dev/null | grep -v ':0' | head -12
          grep -rc 'PATCHED_ROUND16B P3' mod_src/smali*/ 2>/dev/null | grep -v ':0' | head -6
          echo "== 活引用残留扫描（patch 后不应再有未 NOP 的外部 rN/init/registerNatives invoke）=="
          # rN.smali 自身内部自调用豁免（蓝图：类保留防空引用，内部逻辑不影响外部入口断链）
          L1=$(grep -rn 'invoke-.*Lcom/a/a;->init()V' mod_src/smali*/ | grep -v PATCHED | wc -l)
          L2=$(grep -rn 'invoke-.*Lcom/rN;->' mod_src/smali*/ | grep -v PATCHED | grep -v 'com/rN\.smali:' | wc -l)
          L3=$(grep -rn 'invoke-.*Lsgcore0/SafeLoader;->registerNativesForClass' mod_src/smali*/ | grep -v PATCHED | wc -l)
          # round17 硬门：kz7/a 外部调用残留=0；security/̐;->̎ 入口残留=0（在 query/security 包外部，即非包内自引用）
          L4=$(grep -rn 'invoke-.*Lkz7/a;->a()V' mod_src/smali*/ | grep -v PATCHED | grep -v '/kz7/a\.smali:' | wc -l)
          L5=$(grep -rn 'invoke-.*;->.*Landroid/app/Activity;)V' mod_src/smali*/ | grep 'query/security' | grep -v PATCHED | grep -v '/query/security/' | wc -l)
          # round17b 硬门：com/n;->Call 外部残留=0（com/n.smali 类体内自调豁免——入口掐后永不触达）
          L6=$(grep -rn 'invoke-.*Lcom/n;->Call(' mod_src/smali*/ | grep -v PATCHED | grep -v '/com/n\.smali:' | wc -l)
          echo "残留(外部): init=$L1 rN=$L2 registerNatives=$L3 kz7a=$L4 secAct=$L5 nCall=$L6（应全 0；rN/n 自身内部调用不计）"
          [ "$L1" = "0" ] && [ "$L2" = "0" ] && [ "$L3" = "0" ] && [ "$L4" = "0" ] && [ "$L5" = "0" ] && [ "$L6" = "0" ] || { echo '!! 存在未 NOP 的外部活调用'; exit 1; }
          # round17b：P7 集合外命中必须=0（防家族魔改新增入口静默漏掐）
          grep -q 'extra_p7=0' patch-16b.log || { echo '!! P7 存在集合外命中（不确定点未处置）'; exit 1; }
          grep 'PATCH17_RESIDUAL' patch-16b.log

      - name: apktool b 重建
        run: |
          cd work
          java -jar /usr/local/bin/apktool.jar b mod_src -o clean-unsigned.apk
          ls -la clean-unsigned.apk

      - name: zipalign + 签名（v1+v2+v3）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd work
          "$BT/zipalign" -f 4 clean-unsigned.apk clean-aligned.apk
          echo "$KEYSTORE_BASE64" | base64 -d > codery.keystore
          "$BT/apksigner" sign --ks codery.keystore --ks-key-alias codery --ks-pass pass:codery2026 --key-pass pass:codery2026 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out fanqie-73368-clean-signed.apk clean-aligned.apk
          "$BT/apksigner" verify --verbose fanqie-73368-clean-signed.apk | tee verify-16b.txt
          sha256sum fanqie-73368-clean-signed.apk | tee sha256-16b.txt

      - name: Release 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 番茄净化 round17b（崩溃修复 P4/P5/P7 + 弹窗拦截补位 P6）
          body_path: work/sha256-16b.txt
          files: |
            work/fanqie-73368-clean-signed.apk
            work/verify-16b.txt
            work/patch-16b.log
            work/sha256-16b.txt
          fail_on_unmatched_files: true

      - name: 清理版权物
        if: always()
        run: rm -rf work
