name: fanqie-crack-patch

# round16b：破解版底包 patch 构建（卡密体系去除，按 docs/round16b-依赖分析.md 执行清单 P1-P3）
# 原则：宁可残骸不可崩溃——只断 Java invoke，不删类/方法/so
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK（build-tools 35）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-30" "build-tools;35.0.0" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_ENV"

      - name: 下载工具（apktool + baksmali）
        run: |
          curl -sSL -o /usr/local/bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -sSL -o /usr/local/bin/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.10/baksmali-3.0.10-fat.jar
          java -jar /usr/local/bin/apktool.jar --version

      - name: 拉 mod 样本 + sha256 校验
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work && cd work
          gh release download samples -R "$GITHUB_REPOSITORY" -p 'fanqie-73368-mod-218M.apk' -D .
          echo "fdf7e7c1b56a0f3409bf4bf3d1a9c7c252f43d951de0debdbccbb8ff798a3024  fanqie-73368-mod-218M.apk" | sha256sum -c -

      - name: apktool d 解 mod 包
        run: |
          cd work
          java -jar /usr/local/bin/apktool.jar d -f -o mod_src fanqie-73368-mod-218M.apk
          echo "smali 树: $(find mod_src -name '*.smali' | wc -l) 文件"

      - name: patch（P1 init NOP / P2 rN 调用点 NOP / P3 registerNatives NOP）
        run: |
          cd work
          python3 ../scripts/patch_16b.py "$PWD/mod_src" | tee patch-16b.log
          grep -q 'PATCH_16B_DONE' patch-16b.log || { echo '!! patch 脚本未正常结束'; exit 1; }
          # P1 允许 WARN（首跑实锤 init 调用可能内联/不在 stub，标注不确定点交真机验证），P2/P3 必须命中
          grep -q 'P2-rN 合计' patch-16b.log && ! grep -q 'P3-registerNatives: WARN(0 命中' patch-16b.log || { echo '!! P2/P3 关键点位未命中'; exit 1; }

      - name: patch 自检（改动点复核 + 残留引用扫描）
        run: |
          cd work
          echo "== P1 落位核验 =="
          grep -rn 'PATCHED_ROUND16B P1' mod_src/smali*/ | head -3
          echo "== P2/P3 落位统计 =="
          grep -rc 'PATCHED_ROUND16B P2' mod_src/smali*/ 2>/dev/null | grep -v ':0' | head -12
          grep -rc 'PATCHED_ROUND16B P3' mod_src/smali*/ 2>/dev/null | grep -v ':0' | head -6
          echo "== 活引用残留扫描（patch 后不应再有未 NOP 的外部 rN/init/registerNatives invoke）=="
          # rN.smali 自身内部自调用豁免（蓝图：类保留防空引用，内部逻辑不影响外部入口断链）
          L1=$(grep -rn 'invoke-.*Lcom/a/a;->init()V' mod_src/smali*/ | grep -v PATCHED | wc -l)
          L2=$(grep -rn 'invoke-.*Lcom/rN;->' mod_src/smali*/ | grep -v PATCHED | grep -v 'com/rN\.smali:' | wc -l)
          L3=$(grep -rn 'invoke-.*Lsgcore0/SafeLoader;->registerNativesForClass' mod_src/smali*/ | grep -v PATCHED | wc -l)
          echo "残留(外部): init=$L1 rN=$L2 registerNatives=$L3（应全 0；rN 自身内部调用不计）"
          [ "$L1" = "0" ] && [ "$L2" = "0" ] && [ "$L3" = "0" ] || { echo '!! 存在未 NOP 的外部活调用'; exit 1; }

      - name: apktool b 重建
        run: |
          cd work
          java -jar /usr/local/bin/apktool.jar b mod_src -o clean-unsigned.apk
          ls -la clean-unsigned.apk

      - name: zipalign + 签名（v1+v2+v3）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd work
          "$BT/zipalign" -f 4 clean-unsigned.apk clean-aligned.apk
          echo "$KEYSTORE_BASE64" | base64 -d > codery.keystore
          "$BT/apksigner" sign --ks codery.keystore --ks-key-alias codery --ks-pass pass:codery2026 --key-pass pass:codery2026 \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out fanqie-73368-clean-signed.apk clean-aligned.apk
          "$BT/apksigner" verify --verbose fanqie-73368-clean-signed.apk | tee verify-16b.txt
          sha256sum fanqie-73368-clean-signed.apk | tee sha256-16b.txt

      - name: Release 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 番茄净化 round16b（破解版底包·卡密体系去除）
          body_path: work/sha256-16b.txt
          files: |
            work/fanqie-73368-clean-signed.apk
            work/verify-16b.txt
            work/patch-16b.log
            work/sha256-16b.txt
          fail_on_unmatched_files: true

      - name: 清理版权物
        if: always()
        run: rm -rf work
